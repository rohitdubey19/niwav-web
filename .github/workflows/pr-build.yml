name: PR build check

# Builds the site on every pull request to main, so a change (including one the
# CyPhyS stage agent opens, which cannot run a build itself) is checked before
# merge. No deploy, no secrets, read-only token.
on:
  pull_request:
    branches: [main]
    paths:
      - 's2a/web/**'
      - '.github/workflows/pr-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: s2a/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: s2a/web

      - name: Build
        run: npm run build
        working-directory: s2a/web
