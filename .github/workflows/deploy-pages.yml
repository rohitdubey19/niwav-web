name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 's2a/web/src/**'
      - 's2a/web/public/**'
      - 's2a/web/index.html'
      - 's2a/web/package*.json'
      - 's2a/web/vite.config.ts'
      - 's2a/web/tailwind.config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: s2a/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: s2a/web

      - name: Build
        run: npm run build
        working-directory: s2a/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: s2a/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
